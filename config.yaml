# 가상자산 해킹·범죄 지갑 동향 수집기 설정

lookback_days: 7          # 처음/강제 실행 시 며칠 전 게시물까지 볼지
followup_days: 14         # 오늘 사건이 최근 며칠 내 사건의 후속 보도인지 대조할 범위
data_dir: data
report_dir: reports          # reports/YYYY-MM/YYYY-MM-DD.ko.md / .en.md
briefing_dir: briefings      # briefings/YYYY-MM/YYYY-MM-DD.md + briefings/README.md(날짜 인덱스)

# ---------------------------------------------------------------------------
# 소스별 수집 주기(시간). run.py 를 매시간 돌리면 주기가 된 소스만 수집한다.
schedule:
  default_interval_hours: 6
  intervals:
    rekt: 1
    defillama: 1
    slowmist: 2
    zachxbt: 2
    defihacklabs: 3
    doj: 3
    ofac: 6
    ofac_sdn: 24        # SDN 전체 XML(≈30MB) diff
    scamsniffer: 12
    trm: 12
    chainalysis: 12

# ---------------------------------------------------------------------------
# LLM (사건 카드 한/영 + 일일 브리핑)
llm:
  enabled: true
  provider: ollama            # ollama | openrouter | claude   (run.py --provider 로 덮어쓰기 가능)
  fallback_provider: openrouter   # 1순위 공급자 연결 실패 시
  prompt_style: few_shot      # few_shot(예시 2개 포함, 기본) | zero_shot(규칙만)
  max_chars: 60000            # 본문 전달 상한(문자)
  max_tokens: 8000
  workers: 2                  # 동시 요청 수 (Ollama는 1~2 권장)

  dedupe_max_calls: 20        # 실행 1회당 '같은 사건인가' LLM 판정 최대 호출 수 (결과는 캐시됨)

  ollama:                     # 사내 LAN Ollama 서버
    base_url: http://192.168.150.225:11434
    model: gpt-oss:120b       # 대안: qwen3-30b-rag:latest, gemma4:26b, gpt-oss:20b
    # dedupe_model: gpt-oss:20b   # 같은-사건 판정에 다른 모델을 쓰려면 지정 (qwen3-30b-rag 는 '같다'고 남발해서 제외)
    num_ctx: 32768
    think: false
    timeout: 900

  openrouter:                 # OpenAI 호환. 키는 OPENROUTER_API_KEY 환경변수 또는 아래 파일
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.8-flash
    api_key_env: OPENROUTER_API_KEY
    api_key_file: ../vllm/openrouter.txt
    timeout: 300

  claude:                     # ANTHROPIC_API_KEY 필요
    model: claude-opus-5
    effort: medium

# ---------------------------------------------------------------------------
# GitHub 전달: 실행 후 결과물을 commit & push (git init + remote 설정 후 push: true)
github:
  push: true                # https://github.com/lala-david/crypto_test — 매 실행 후 변경분 commit & push
  remote: origin
  paths:
    - reports
    - briefings
    - data/state.json
    - data/incidents.jsonl
    - data/addresses.csv
    - data/ofac_sdn_addresses.csv
    - data/briefings

# ---------------------------------------------------------------------------
# Teams 알림 (Workflows 웹훅, Adaptive Card): 새 사건 카드마다 1회 + 그날 첫 브리핑 1회 + 수집 오류
#   채널 → … → Workflows → "웹훅 요청을 받으면 채널에 게시" → URL 을 teams_webhook.txt(git 제외) 또는 TEAMS_WEBHOOK_URL 에
#   → python -m collector.notify --test --channel teams
teams:
  enabled: true
  webhook_env: TEAMS_WEBHOOK_URL
  webhook_file: teams_webhook.txt
  min_amount_usd: 0            # 이 금액 미만 사건은 생략 (제재·수사 건은 항상). 0 = 전부
  max_per_run: 10
  daily_briefing: true
  alert_on_errors: true
  github_url: https://github.com/lala-david/crypto_test

# ---------------------------------------------------------------------------
# Telegram 알림: 새 사건 카드마다 1회 + 그날 첫 브리핑 1회. 토큰/채팅이 없으면 조용히 건너뜀.
#   1) @BotFather 로 봇 생성 → 토큰을 telegram_bot_token.txt(git 제외) 또는 환경변수 TELEGRAM_BOT_TOKEN 에
#   2) 봇에게 메시지를 보내거나 채널 관리자로 추가 → python -m collector.notify --setup 으로 chat id 확인
#   3) chat_id 기입 → python -m collector.notify --test
telegram:
  enabled: false               # Teams 로 대체 (사용자 지시)
  bot_token_env: TELEGRAM_BOT_TOKEN
  bot_token_file: telegram_bot_token.txt
  chat_env: TELEGRAM_ALERT_CHAT
  chat_id: ""                  # 예: "-1001234567890" 또는 "@channel"
  min_amount_usd: 0            # 이 금액 미만 사건은 알림 생략 (제재·수사 건은 항상 발송). 0 = 전부
  max_per_run: 10
  daily_briefing: true
  alert_on_errors: true
  github_url: https://github.com/lala-david/crypto_test

# ---------------------------------------------------------------------------
# crimial_hunter(scam-address-data) 연동: 기존 블랙리스트 대조 + 표준 스키마 CSV 내보내기
crimial_hunter:
  enabled: true
  repo_dir: ../experience/scam-address-data
  lookup_files: [master_all.csv, sources/ofac_sanctions_all.csv, sources/gov_law_enforcement_all.csv]
  export_file: sources/news_collector.csv          # 저장소 안 경로 (build_master.py 목록에 추가하면 마스터 편입)
  export_copy: data/export/crimial_hunter_news_collector.csv
  roles: [attacker, laundering, sanctioned]        # 내보낼 역할 (victim/unknown 제외)
  exclude_sources: [scamsniffer, ofac_sdn]         # 이미 그쪽 소스에 있는 것

# ---------------------------------------------------------------------------
sources:
  rekt:
    enabled: true
    max_articles: 20
  lumos:
    enabled: false            # ChainLight Lumos — 갱신 정체(최신 2025-10)로 제외
  defillama:
    enabled: true
  trm:
    enabled: true
  chainalysis:
    enabled: true
  ofac:
    enabled: true
    sdn_diff: true
  doj:
    enabled: true
    max_pages: 10
  slowmist:                   # hacked.slowmist.io — 가장 촘촘한 사고 목록(소액·CEX·지갑 포함)
    enabled: true
    max_pages: 2
  zachxbt:                    # t.me/s/investigations — 공격자/세탁 주소가 자주 포함
    enabled: true
    channel: investigations
    max_pages: 2
  scamsniffer:                # 피싱/드레이너 주소 블랙리스트 diff
    enabled: true
  defihacklabs:               # README 사고 목록 + PoC 헤더의 공격자 EOA
    enabled: true
  # 임의 RSS. 옵션: require_keywords(기본 true), fetch_article(기본 true), user_agent, selectors, enabled
  extra_rss:
    - name: cointelegraph_hacks
      url: https://cointelegraph.com/rss/tag/hacks
      fetch_article: false
    - name: cointelegraph_scams
      url: https://cointelegraph.com/rss/tag/scams
      fetch_article: false
    - name: boannews            # 보안뉴스 사건·사고
      url: https://www.boannews.com/rss/S1N2.xml
      fetch_article: false
    - name: blockmedia
      url: https://www.blockmedia.co.kr/feed
      fetch_article: false
    - name: tokenpost
      url: https://www.tokenpost.kr/rss
      fetch_article: false
    - name: sec_litigation      # SEC는 연락처가 든 UA 필요
      url: https://www.sec.gov/enforcement-litigation/litigation-releases/rss
      user_agent: "crypto-incident-collector wnswns1946@kloint.team"
      fetch_article: false
    - name: slowmist_medium
      url: https://medium.com/feed/@slowmist
      enabled: false

# 사건 주소로 취급하지 않을 주소 (사이트 후원 지갑 등). 반드시 따옴표 (0x… 는 YAML이 숫자로 읽음)
ignore_addresses:
