<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incident Ledger</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>window.__errs=[];addEventListener('error',e=>{window.__errs.push(String(e.message)+' @ '+(e.filename||'')+':'+e.lineno);document.title='ERR: '+window.__errs.join(' | ').slice(0,300)});addEventListener('unhandledrejection',e=>{window.__errs.push('rej '+String(e.reason&&e.reason.message||e.reason));document.title='ERR: '+window.__errs.join(' | ').slice(0,300)});</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
