<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리핑 · Incident Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="page">
  <div class="page-h"><div><h1 data-i18n="nav_briefings">브리핑</h1><div class="sub" id="sub"></div></div></div>
  <section class="grid start">
    <div class="card c3"><div class="card-h"><h2 data-i18n="day">날짜</h2><span class="meta" id="metaDays"></span></div><ul class="day-list" id="dayList"></ul></div>
    <div style="grid-column: span 9; display: grid; gap: 12px; min-width: 0">
      <div class="card"><div class="card-h"><h2 id="briefTitle"></h2><span class="meta" id="briefMeta"></span></div><div class="headline" id="briefHeadline"></div><div class="card-b brief" id="briefBody"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="day_incidents">당일 사건</h2><span class="meta" id="metaDay"></span></div><div class="card-b flush table-wrap"><table class="tbl" id="dayTable"></table></div><div id="dayLegend"></div></div>
    </div>
  </section>
</main>
<footer class="foot" id="foot"></footer>
<div class="tooltip" id="tip" role="tooltip"></div>
<script src="common.js"></script><script src="briefings.js"></script>
</body>
</html>
