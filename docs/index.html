<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell"><aside class="side" id="nav"></aside><div class="main"><header class="topbar" id="topbar"></header>
<main class="ledger">
  <section class="feed">
    <div class="hero slim" id="hero"><div class="slim-l"><div class="slim-date" id="slimDate"></div><span class="pill-glass"><span class="dot"></span><span id="heroPillText"></span></span></div></div>
    <div id="feed"></div>
    <div class="feed-more"><a class="btn-ghost sm" href="incidents.html" data-i18n="see_all">전체 보기 →</a></div>
  </section>
  <aside class="rail">
    <section class="panel brief-card">
      <div class="panel-head"><h2 data-i18n="todays_briefing">오늘의 브리핑</h2><a class="more" href="briefings.html" data-i18n="see_all">전체 보기 →</a></div>
      <p class="headline" id="briefHeadline"></p>
      <div class="briefing-body compact" id="briefingBody"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 data-i18n="tab_value">피해 금액</h2><a class="more" href="stats.html" data-i18n="see_all">전체 보기 →</a></div>
      <div class="panel-body"><div class="plot" id="homePlot"></div></div>
    </section>
    <section class="panel"><div class="panel-head"><h2 data-i18n="by_type">유형별 건수</h2></div><div class="panel-body side-plot hb" id="homeTypes"></div></section>
    <article class="panel integration">
      <div class="visual" id="network"></div>
      <div class="copy row"><h3 id="netTitle"></h3></div>
    </article>
  </aside>
</main>
<footer class="foot" id="foot"></footer></div></div>
<div class="tooltip" id="tip" role="tooltip"></div>
<script src="common.js"></script><script src="home.js"></script>
</body>
</html>
