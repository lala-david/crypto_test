<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Incident Monitor</title>
<meta name="description" content="가상자산 해킹·범죄 지갑 동향 — 매시간 수집, 한/영 사건 카드와 일일 브리핑">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <h1 data-i18n="title">가상자산 해킹·범죄 지갑 동향</h1>
      <p class="sub"><span data-i18n="subtitle">rekt · SlowMist · DeFiLlama · DeFiHackLabs · ZachXBT · TRM · Chainalysis · OFAC · DOJ 등 12개 소스를 매시간 수집</span> · <span id="updated"></span></p>
    </div>
  </div>
  <div class="actions">
    <button id="langBtn" class="pill" type="button" aria-label="language">EN</button>
    <button id="themeBtn" class="pill" type="button" aria-label="theme">☾</button>
    <a class="pill" id="repoLink" href="https://github.com/lala-david/crypto_test" target="_blank" rel="noopener">GitHub</a>
  </div>
</header>

<main>
  <section class="kpis" id="kpis" aria-label="summary"></section>

  <section class="card briefing" id="briefingCard">
    <div class="card-head">
      <h2 data-i18n="latest_briefing">최신 브리핑</h2>
      <div class="row gap">
        <select id="briefingDay" aria-label="briefing day"></select>
      </div>
    </div>
    <p class="headline" id="briefingHeadline"></p>
    <div class="briefing-body" id="briefingBody"></div>
  </section>

  <section class="filters card" aria-label="filters">
    <div class="seg" id="rangeSeg" role="group" aria-label="range">
      <button data-range="7" type="button">7d</button>
      <button data-range="30" type="button" class="on">30d</button>
      <button data-range="90" type="button">90d</button>
      <button data-range="all" type="button" data-i18n="all">전체</button>
    </div>
    <select id="typeSel" aria-label="type"></select>
    <select id="chainSel" aria-label="chain"></select>
    <select id="sourceSel" aria-label="source"></select>
    <input id="q" type="search" placeholder="프로젝트 · 주소 · 키워드 검색" data-i18n-ph="search_ph" aria-label="search">
    <label class="chk"><input id="hideFollow" type="checkbox"> <span data-i18n="hide_follow">후속 보도 숨기기</span></label>
  </section>

  <section class="charts">
    <div class="card chart" id="chartDaily">
      <div class="card-head"><h3 data-i18n="chart_daily">일별 사건 수</h3><button class="link" data-table="daily" type="button" data-i18n="table_view">표로 보기</button></div>
      <div class="plot" id="dailyPlot"></div>
    </div>
    <div class="card chart" id="chartType">
      <div class="card-head"><h3 data-i18n="chart_type">유형별 사건 수</h3><button class="link" data-table="type" type="button" data-i18n="table_view">표로 보기</button></div>
      <div class="plot" id="typePlot"></div>
    </div>
    <div class="card chart" id="chartChain">
      <div class="card-head"><h3 data-i18n="chart_chain">체인별 피해액</h3><button class="link" data-table="chain" type="button" data-i18n="table_view">표로 보기</button></div>
      <div class="plot" id="chainPlot"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2><span data-i18n="incidents">사건 목록</span> <span class="count" id="incCount"></span></h2>
      <span class="muted small" data-i18n="click_hint">행을 누르면 상세 카드가 열립니다</span>
    </div>
    <div class="table-wrap">
      <table class="inc" id="incTable">
        <thead><tr>
          <th data-i18n="th_date">사건일</th><th data-i18n="th_incident">사건</th><th data-i18n="th_type">유형</th>
          <th data-i18n="th_chain">체인</th><th class="num" data-i18n="th_amount">금액</th><th class="num" data-i18n="th_addr">주소</th><th data-i18n="th_source">출처</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-inner">
    <button class="close" id="drawerClose" type="button" aria-label="close">✕</button>
    <div id="drawerBody"></div>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>

<div class="modal" id="tableModal" aria-hidden="true">
  <div class="modal-inner">
    <button class="close" id="tableClose" type="button" aria-label="close">✕</button>
    <div id="tableBody"></div>
  </div>
</div>

<div class="tooltip" id="tip" role="tooltip"></div>

<footer class="foot">
  <span data-i18n="foot">데이터는 공개 소스에서 자동 수집·LLM 요약된 것으로 오류가 있을 수 있습니다. 주소는 반드시 원문으로 재확인하세요.</span>
</footer>
<script src="app.js"></script>
</body>
</html>
