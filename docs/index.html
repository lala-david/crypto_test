<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloint Incident Monitor</title>
<meta name="description" content="가상자산 해킹·범죄 지갑 동향 — 매시간 수집, 한/영 사건 카드와 일일 브리핑">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-l">
    <a class="brand" href="./"><span class="mark">❋</span><span class="word">Kloint</span><span class="brand-sub" data-i18n="brand_sub">Threat Intelligence</span></a>
    <a class="nav-link on" href="#hacks" data-i18n="nav_hacks">사건</a>
    <a class="nav-link" href="#briefing" data-i18n="nav_briefing">브리핑</a>
    <a class="nav-link" href="#stats" data-i18n="nav_stats">통계</a>
  </div>
  <div class="nav-r">
    <span id="updated" class="updated"></span>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="theme">☀</button>
    <button id="langBtn" class="btn-accent" type="button" aria-label="language">EN</button>
  </div>
</nav>

<header class="hero">
  <div class="stars" id="stars"></div>
  <div class="hero-inner">
    <div class="hero-l">
      <h1 class="hero-title"><span id="typed"></span><span class="cursor"></span></h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
    </div>
    <div class="hero-kpis" id="kpis" aria-label="summary"></div>
  </div>
</header>
<div class="strip"><div class="marquee" id="ticker"></div></div>

<main id="hacks">
  <section class="toolbar">
    <div class="total"><span data-i18n="total">사건</span> <b id="incCount">0</b></div>
    <div class="controls">
      <label class="ctl"><select id="typeSel" aria-label="type"></select></label>
      <label class="ctl"><select id="chainSel" aria-label="chain"></select></label>
      <label class="ctl"><select id="sourceSel" aria-label="source"></select></label>
      <div class="ctl seg" id="rangeSeg" role="group" aria-label="range">
        <button data-range="7" type="button">7d</button>
        <button data-range="30" type="button" class="on">30d</button>
        <button data-range="90" type="button">90d</button>
        <button data-range="all" type="button" data-i18n="all">전체</button>
      </div>
    </div>
  </section>

  <section class="panel" id="stats">
    <div class="tabs" id="statTabs" role="tablist">
      <button class="tab on" data-tab="value" type="button" data-i18n="tab_value">피해 금액</button>
      <button class="tab" data-tab="type" type="button" data-i18n="tab_type">공격 유형</button>
      <button class="tab" data-tab="chain" type="button" data-i18n="tab_chain">체인별</button>
      <button class="tab" data-tab="legal" type="button" data-i18n="tab_legal">제재·수사·주소</button>
    </div>
    <div class="panel-body">
      <div class="panel-top">
        <div class="seg small" id="valueMode" role="group">
          <button data-mode="amount" class="on" type="button" data-i18n="mode_amount">금액 (USD)</button>
          <button data-mode="count" type="button" data-i18n="mode_count">건수</button>
        </div>
        <div class="panel-kpi" id="panelKpi"></div>
      </div>
      <div class="panel-grid">
        <div class="plot main" id="mainPlot"></div>
        <div class="side" id="sidePlot"></div>
      </div>
      <button class="link" id="tableViewBtn" type="button" data-i18n="table_view">표로 보기</button>
    </div>
  </section>

  <section class="panel" id="briefing">
    <div class="panel-head">
      <h2 data-i18n="latest_briefing">일일 브리핑</h2>
      <select id="briefingDay" aria-label="briefing day"></select>
    </div>
    <p class="headline" id="briefingHeadline"></p>
    <div class="briefing-body" id="briefingBody"></div>
  </section>

  <section class="search">
    <span class="search-ico">⌕</span>
    <input id="q" type="search" placeholder="프로젝트 이름, 주소, 키워드 검색" data-i18n-ph="search_ph" aria-label="search">
    <label class="chk"><input id="hideFollow" type="checkbox"> <span data-i18n="hide_follow">후속 보도 숨기기</span></label>
  </section>

  <section class="panel table-panel">
    <div class="table-wrap">
      <table class="inc" id="incTable">
        <thead><tr>
          <th data-i18n="th_incident">사건</th>
          <th data-i18n="th_amount">피해 금액</th>
          <th data-i18n="th_date">사건일</th>
          <th data-i18n="th_type">공격 유형</th>
          <th data-i18n="th_chain">체인</th>
          <th class="num" data-i18n="th_addr">주소</th>
          <th class="center" data-i18n="th_conf">교차 검증</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<div class="modal" id="tableModal" aria-hidden="true">
  <div class="modal-inner">
    <button class="close" id="tableClose" type="button" aria-label="close">✕</button>
    <div id="tableBody"></div>
  </div>
</div>
<div class="tooltip" id="tip" role="tooltip"></div>

<footer class="foot">
  <span data-i18n="foot"></span> · <a href="https://github.com/lala-david/crypto_test" target="_blank" rel="noopener">GitHub</a>
</footer>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
