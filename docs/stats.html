<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>통계 · Incident Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="page lumos">
  <div class="page-h"><div><h1 data-i18n="nav_stats">통계</h1><div class="sub" id="sub"></div></div>
    <div class="controls"><div class="seg" id="rangeSeg"></div></div></div>
  <section class="grid">
    <div class="card c12"><div class="card-h"><h2 id="tsTitle"></h2><div class="seg" id="valueMode"><button data-mode="amount" class="on" data-i18n="mode_amount">금액</button><button data-mode="count" data-i18n="mode_count">건수</button></div></div><div class="card-b plot" id="tsPlot"></div></div>
  </section>
  <section class="grid start">
    <div class="card c6"><div class="card-h"><h2 data-i18n="tab_type">유형</h2><span class="meta" id="metaType"></span></div><div class="card-b rank" id="typeRank"></div></div>
    <div class="card c6"><div class="card-h"><h2 data-i18n="roles">주소 역할</h2><span class="meta" id="metaRoles"></span></div><div class="card-b rank" id="rolesRank"></div></div>
    <div class="card c12"><div class="card-h"><h2 data-i18n="tab_chain">체인</h2><span class="meta" id="metaChain"></span></div><div class="card-b chain-split"><div class="rank" id="chainRank"></div><div class="tail" id="chainTail"></div></div></div>
  </section>
</main>
<div class="case-backdrop" id="caseBackdrop"></div><aside class="case-drawer" id="caseDrawer" aria-label="case"></aside>
<div class="tooltip" id="tip" role="tooltip"></div>
<script src="common.js"></script><script src="icons.js"></script><script src="hud.js"></script><script src="case.js"></script><script src="stats.js"></script>
</body>
</html>
