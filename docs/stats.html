<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>분석 · Incident Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="page">
  <div class="page-h"><div><h1 data-i18n="nav_stats">분석</h1><div class="sub" id="sub"></div></div>
    <div class="controls"><label class="ctl"><select id="typeSel"></select></label><label class="ctl"><select id="chainSel"></select></label>
      <div class="seg" id="rangeSeg"><button data-range="7">7d</button><button data-range="30" class="on">30d</button><button data-range="90">90d</button><button data-range="all" data-i18n="all">전체</button></div></div></div>
  <section class="grid">
    <div class="card c12"><div class="card-h"><h2 id="tsTitle"></h2><div class="seg" id="valueMode"><button data-mode="amount" class="on" data-i18n="mode_amount">금액</button><button data-mode="count" data-i18n="mode_count">건수</button></div></div><div class="card-b plot" id="tsPlot"></div></div>
  </section>
  <section class="grid">
    <div class="card c6"><div class="card-h"><h2 data-i18n="tab_type">유형</h2><span class="meta" id="metaType"></span></div><div class="card-b flush table-wrap"><table class="tbl" id="typeTable"></table></div></div>
    <div class="card c6"><div class="card-h"><h2 data-i18n="tab_chain">체인</h2><span class="meta" id="metaChain"></span></div><div class="card-b flush table-wrap"><table class="tbl" id="chainTable"></table></div></div>
  </section>
  <section class="grid">
    <div class="card c6"><div class="card-h"><h2 data-i18n="daily_count">일별 사건 수</h2><span class="meta" id="metaDaily"></span></div><div class="card-b flush table-wrap"><table class="tbl" id="dailyTable"></table></div></div>
    <div class="card c6"><div class="card-h"><h2 data-i18n="tab_legal">제재·수사·주소</h2><span class="meta" id="metaLegal"></span></div><div class="card-b plot" id="legalPlot"></div><div class="card-b hb" id="rolesBars"></div></div>
  </section>
</main>
<footer class="foot" id="foot"></footer>
<div class="tooltip" id="tip" role="tooltip"></div>
<script src="common.js"></script><script src="stats.js"></script>
</body>
</html>
